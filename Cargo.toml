[workspace]
resolver = "2"
members = ["crates/core", "crates/filesystem", "crates/scanner", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
# Domain / shared (GPUI-free)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
config = { version = "0.15.27", default-features = false, features = ["json"] }
directories = "6.0.0"
tempfile = "3.27.0"
anyhow = "1.0.105"
# UI shell
gpui-kit = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
