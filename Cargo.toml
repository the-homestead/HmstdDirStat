[workspace]
resolver = "2"
members = ["crates/core", "crates/filesystem", "crates/scanner", "crates/ntfs", "crates/search", "crates/fileops", "crates/duplicates", "crates/app", "crates/archive", "crates/storage-insights", "crates/dev-storage", "crates/scan-history", "crates/scan-comparison"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
# Domain / shared (GPUI-free)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
config = { version = "0.15.27", default-features = false, features = ["json"] }
directories = "6.0.0"
tempfile = "3.27.0"
trash = "5.4.0"
blake3 = "1.8.7"
rayon = "1.12.0"
same-file = "1.0.6"
anyhow = "1.0.105"
# UI shell
gpui-kit = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
