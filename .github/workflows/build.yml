name: Build packages

# Builds every release artifact for one version. Called by release.yml (tags) and beta.yml
# (every push to main). Windows is required; Linux is best effort and never blocks a release.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      version:
        description: Numeric version written into Cargo.toml and the installers (X.Y.Z)
        required: true
        type: string
      label:
        description: Version shown in file names (X.Y.Z or X.Y.Z-beta.N)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Set the build version
        shell: bash
        run: sed -i -E '0,/^version = ".*"/s//version = "${{ inputs.version }}"/' Cargo.toml
      - name: Build setup.exe and MSI
        working-directory: crates/app
        run: cargo packager --release -f nsis,wix
      - name: Collect artifacts
        shell: pwsh
        run: |
          $label = "${{ inputs.label }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem target/release -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem target/release -Recurse -Filter "*.msi" | Select-Object -First 1
          if (-not $setup -or -not $msi) { throw "installer missing: setup=$setup msi=$msi" }
          Copy-Item $setup.FullName "dist/TimberStat-$label-windows-x64-setup.exe"
          Copy-Item $msi.FullName "dist/TimberStat-$label-windows-x64.msi"
          $portable = "portable/TimberStat-$label"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target/release/timberstat.exe, LICENSE, README.md $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "dist/TimberStat-$label-windows-x64-portable.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64 (best effort)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Install GPUI build libraries and AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev libfuse2 file
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Set the build version
        run: sed -i -E '0,/^version = ".*"/s//version = "${{ inputs.version }}"/' Cargo.toml
      - name: Build .deb and AppImage
        working-directory: crates/app
        run: cargo packager --release -f deb,appimage
      - name: Collect artifacts
        run: |
          label="${{ inputs.label }}"
          mkdir -p dist "portable/TimberStat-$label"
          cp "$(find target/release -name '*.deb' | head -1)" "dist/TimberStat-$label-linux-x64.deb"
          cp "$(find target/release -name '*.AppImage' | head -1)" "dist/TimberStat-$label-linux-x64.AppImage"
          cp target/release/timberstat LICENSE README.md "portable/TimberStat-$label/"
          tar -C portable -czf "dist/TimberStat-$label-linux-x64-portable.tar.gz" "TimberStat-$label"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
