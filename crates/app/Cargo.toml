[package]
name = "timberstat-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "TimberStat: disk usage analyser and file manager (GPUI + GPUI Kit)."

[[bin]]
name = "timberstat"
path = "src/main.rs"

[dependencies]
timberstat-duplicates = { path = "../duplicates" }
timberstat-core = { path = "../core" }
timberstat-filesystem = { path = "../filesystem" }
timberstat-fileops = { path = "../fileops" }
timberstat-scanner = { path = "../scanner" }
timberstat-engine = { path = "../engine" }
timberstat-ntfs = { path = "../ntfs" }
timberstat-search = { path = "../search" }
timberstat-scan-history = { path = "../scan-history" }
gpui-kit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Already in the tree through gpui; embeds the exe/window icon (build.rs).
embed-resource = "3.0.12"

[lints]
workspace = true

# Installers and packages (cargo-packager). Built by CI; see RELEASE.md.
[package.metadata.packager]
product-name = "TimberStat"
identifier = "com.the-homestead.timberstat"
publisher = "The Homestead"
description = "Disk usage analyser and file manager"
homepage = "https://github.com/the-homestead/TimberStat"
category = "Utility"
license-file = "../../LICENSE"
before-packaging-command = "cargo build --release -p timberstat-app"
out-dir = "../../target/release"
binaries = [{ path = "timberstat", main = true }]
# The .ico is the Windows app icon (MSI, shortcuts); the PNGs are the Linux .deb/AppImage icons.
icons = ["../../assets/favicon.ico", "../../assets/icons/*.png"]

[package.metadata.packager.nsis]
# Per-user install: no administrator prompt, Start menu entry and uninstaller.
installer-mode = "currentUser"
installer-icon = "../../assets/favicon.ico"

[package.metadata.packager.deb]
# GPUI's runtime libraries (the -dev packages CI installs to build it).
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libxcb1", "libvulkan1", "libfontconfig1"]
