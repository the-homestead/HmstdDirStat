    <text x="924.8" y="120.0" font-size="18" font-weight="700" fill="#fbe8c0">Files</text>
    <text x="924.8" y="143.0" font-size="18" fill="#fbe8c0" opacity="0.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">130.1 GiB</text>
    <rect x="1036.0" y="72.0" width="108.0" height="113.4" rx="6" fill="#9aa456" stroke="#351507" stroke-width="3.5"/>
